# Commit message tags select what to run: `[only X]` runs only the listed steps, `[skip X]`
# skips them, where X is a comma-separated list of: `tests` (everything), `julia` (released
# Julia versions), `nightly`, `cuda` (CUDA toolkits). All steps need a multi-GPU runner, of
# which there are few, so pull requests only test the oldest and newest supported Julia
# release, and the oldest and newest toolkit of each CUDA major version; the other Julia
# versions (including nightly) and toolkits are tested on branch builds, or when selected
# explicitly with `[only X]`. Draft pull requests only test the newest Julia release. These
# are the same tags as in CUDA.jl's CI.
steps:
  # first, test supported Julia versions (using the CUDA toolkit that CUDACore selects)
  - group: ":julia: Julia"
    key: "julia"
    steps:
      # the newest release, also tested on draft pull requests
      - &julia
        label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1: ~
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
          multigpu: "*"
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ || build.message !~ /\[only /)
        timeout_in_minutes: 45
        matrix:
          setup:
            julia:
              - "1.13"

      # the oldest release
      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        matrix:
          setup:
            julia:
              - "1.10"

      # intermediate releases, not tested on pull requests
      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ ||
           build.message !~ /\[only / && build.pull_request.id == null)
        matrix:
          setup:
            julia:
              - "1.11"
              - "1.12"

      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|nightly)/ &&
          (build.message =~ /\[only [^\]]*(tests|nightly)/ ||
           build.message !~ /\[only / && build.pull_request.id == null)
        soft_fail: true
        matrix:
          setup:
            julia:
              - "nightly"

  # then, test supported CUDA toolkits (installed through the artifact system)
  - group: "CUDA"
    key: "cuda"
    depends_on: "julia"
    steps:
      # the oldest and newest toolkit of each major version
      - &cuda
        label: "CUDA {{matrix.cuda}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.12"
          - JuliaCI/julia-test#v1: ~
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
          multigpu: "*"
        if: |
          build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
          (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 45
        matrix:
          setup:
            cuda:
              - "13.4"
              - "13.0"
              - "12.9"
              - "12.0"
        # CUDACore and NCCL_jll select the toolkit with CUDA_Runtime_jll's preferences, and
        # CUDACore requires the compiler from CUDA_Compiler_jll to have the same major
        # version, so use the newest compiler of each major. Preferences only apply to
        # packages in the project, so add them as extras.
        commands: |
          case "{{matrix.cuda}}" in
            13.*) compiler="13.4" ;;
            12.*) compiler="12.9" ;;
            *) exit 1 ;;
          esac
          echo -e "[extras]\nCUDA_Runtime_jll = \"76a88914-d11a-5bdc-97e0-2f5a05c973a2\"\nCUDA_Compiler_jll = \"d1e2174e-dfdc-576e-b43e-73b79eb1aca8\"\nCUDA_Driver_jll = \"4ee394cb-3365-5eb0-8335-949819d2adfc\"" >>test/Project.toml
          echo -e "[CUDA_Runtime_jll]\nversion = \"{{matrix.cuda}}\"" >test/LocalPreferences.toml
          echo -e "[CUDA_Compiler_jll]\nversion = \"$${compiler}\"" >>test/LocalPreferences.toml
          echo -e "[CUDA_Driver_jll]\ncompat = \"false\"" >>test/LocalPreferences.toml

      # intermediate toolkits, not tested on pull requests
      - <<: *cuda
        if: |
          build.message !~ /\[skip [^\]]*(tests|cuda)/ &&
          (build.message =~ /\[only [^\]]*(tests|cuda)/ ||
           build.message !~ /\[only / && build.pull_request.id == null)
        matrix:
          setup:
            cuda:
              - "13.3"
              - "13.2"
              - "13.1"
              - "12.8"
              - "12.6"
              - "12.5"
              - "12.4"
              - "12.3"
              - "12.2"
              - "12.1"

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager" # OK to downloading JLLs from GitHub
