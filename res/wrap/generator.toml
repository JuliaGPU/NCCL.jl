[general]
library_name = "libnccl"
output_file_path = "../../src/libnccl.jl"
module_name = "LibNCCL"
jll_pkg_name = "NCCL_jll"
export_symbol_prefixes = ["nccl"]
prologue_file_path = "./prologue.jl"
epilogue_file_path = "./epilogue.jl"

[codegen]
use_ccall_macro = true
always_NUL_terminated_string = true


# Clang.jl maps every `void*` to `Ptr{Cvoid}`; device pointers need to be `CuPtr`, and
# pointers that may refer to either memory space `PtrOrCuPtr`.
# Entries also apply to the profiling entry points (`pnccl*`).

[api.ncclRedOpCreatePreMulSum.argtypes]
2 = "PtrOrCuPtr{Cvoid}"

[api.ncclMemAlloc.argtypes]
1 = "Ptr{CuPtr{Cvoid}}"

[api.ncclMemFree.argtypes]
1 = "CuPtr{Cvoid}"

[api.ncclCommRegister.argtypes]
2 = "CuPtr{Cvoid}"

[api.ncclCommWindowRegister.argtypes]
2 = "CuPtr{Cvoid}"

[api.ncclWinGetUserPtr.argtypes]
3 = "Ptr{CuPtr{Cvoid}}"

[api.ncclBcast.argtypes]
1 = "CuPtr{Cvoid}"

[api.ncclSend.argtypes]
1 = "CuPtr{Cvoid}"

[api.ncclRecv.argtypes]
1 = "CuPtr{Cvoid}"

[api.ncclPutSignal.argtypes]
1 = "CuPtr{Cvoid}"

[api.ncclReduce.argtypes]
1 = "CuPtr{Cvoid}"
2 = "CuPtr{Cvoid}"

[api.ncclReduceConfig.argtypes]
1 = "CuPtr{Cvoid}"
2 = "CuPtr{Cvoid}"

[api.ncclBroadcast.argtypes]
1 = "CuPtr{Cvoid}"
2 = "CuPtr{Cvoid}"

[api.ncclBroadcastConfig.argtypes]
1 = "CuPtr{Cvoid}"
2 = "CuPtr{Cvoid}"

[api.ncclAllReduce.argtypes]
